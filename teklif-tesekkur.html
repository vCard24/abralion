<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Teklif Talebiniz Alındı - Abralion</title>
  <link rel="icon" href="assets/images/arma.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dark-theme.css">
  <link rel="stylesheet" href="assets/css/quote-form.css?v=20260530b">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/noir-migration.css?v=20260530a">
</head>
<body class="page-quote bg-carbon-black text-on-surface font-body-md antialiased min-h-screen flex flex-col">
  <main id="main-content" class="flex-1 flex items-center justify-center px-margin-mobile py-16">
    <div class="quote-form-panel rounded-xl p-8 md:p-12 max-w-xl w-full text-center space-y-6">
      <div class="quote-thank-you-icon mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-green-500/15">
        <span class="material-symbols-outlined text-5xl text-green-400" aria-hidden="true">check_circle</span>
      </div>
      <h1 class="font-headline-md text-headline-md text-white m-0">Teklif talebiniz alındı</h1>
      <p class="text-on-surface-variant m-0" id="tesekkur-message">Talebiniz kaydedildi. Uzman ekibimiz genellikle 24 saat içinde size dönüş yapar.</p>
      <p class="text-steel-gray text-sm m-0" id="tesekkur-ref"></p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
        <a href="index.html" class="inline-flex items-center justify-center bg-abrasive-red text-white px-8 py-3 font-label-caps text-label-caps uppercase hover:brightness-110 transition-all">Ana sayfaya dön</a>
        <a href="fiyat-teklifi.html" class="inline-flex items-center justify-center quote-btn-outline py-3 px-8">Yeni teklif</a>
      </div>
    </div>
  </main>
  <script>
    (function () {
      var data = null;
      try {
        data = JSON.parse(sessionStorage.getItem('abralion_quote_last_submit') || 'null');
      } catch (e) {}
      if (data && data.name) {
        document.getElementById('tesekkur-message').textContent =
          'Teşekkürler ' + data.name + '. Talebiniz kaydedildi; uzman ekibimiz genellikle 24 saat içinde size dönüş yapar.';
      }
      if (data && data.reference) {
        document.getElementById('tesekkur-ref').textContent = 'Referans no: ' + data.reference;
      }
    })();
  </script>
</body>
</html>
